spring:
  application:
    name: api
  datasource:
    url: jdbc:postgresql://localhost:5432/irontrail
    username: ${DB_USERNAME:irontrail}
    password: ${DB_PASSWORD:irontrail_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
server:
  servlet:
    context-path: /api
jwt:
  secret: ${JWT_SECRET:CHANGE_ME_LOCAL_DEV_ONLY_DO_NOT_USE_IN_PRODUCTION_00000}
  expiration: 1d
